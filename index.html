<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Movie Watchlist</title>
<style>
body{font-family:Arial;background:#fdf2f8;padding:25px}
main{max-width:650px;margin:auto;background:white;padding:25px;border-radius:15px}
input{width:100%;box-sizing:border-box;padding:12px;margin:8px 0;border:1px solid #f9a8d4;border-radius:8px}
button{background:#db2777;color:white;border:0;padding:10px 15px;border-radius:7px;cursor:pointer;margin:4px}
.movie{background:#fce7f3;padding:15px;margin:10px 0;border-radius:9px}
</style>
</head>
<body>
<main>
<h1>Movie Watchlist</h1>
<p>Organize your favorite movies.</p>
<input id="title" placeholder="Movie title">
<input id="year" type="number" min="1888" max="2100" placeholder="Release year">
<button onclick="addMovie()">Add Movie</button>
<p id="status"></p>
<h2>My Movies</h2>
<div id="movies"></div>
</main>
<script>
let movies=JSON.parse(localStorage.getItem("movieWatchlist")||"[]");
function save(){
 localStorage.setItem("movieWatchlist",JSON.stringify(movies));
 render();
}
function addMovie(){
 const titleField=document.getElementById("title");
 const yearField=document.getElementById("year");
 const title=titleField.value.trim();
 const year=Number(yearField.value);
 const status=document.getElementById("status");
 if(!title||yearField.value===""||year<1888||year>2100){
  status.textContent="Enter a valid movie title and release year.";
  return;
 }
 const duplicate=movies.some(m=>
  m.title.toLowerCase()===title.toLowerCase()&&m.year===year
 );
 if(duplicate){
  status.textContent="This movie is already in your watchlist.";
  return;
 }
 movies.unshift({title,year,watched:false});
 titleField.value="";
 yearField.value="";
 status.textContent="Movie added successfully!";
 save();
}
function render(){
 const list=document.getElementById("movies");
 list.innerHTML="";
 movies.forEach((movie,i)=>{
  const card=document.createElement("div");
  card.className="movie";
  const h=document.createElement("h3");
  h.textContent=movie.title+" ("+movie.year+")";
  const p=document.createElement("p");
  p.textContent=movie.watched?"Watched":"Not watched yet";
  const toggle=document.createElement("button");
  toggle.textContent=movie.watched?"Mark Unwatched":"Mark Watched";
  toggle.onclick=()=>{movies[i].watched=!movies[i].watched;save();};
  const del=document.createElement("button");
  del.textContent="Delete";
  del.onclick=()=>{movies.splice(i,1);save();};
  card.append(h,p,toggle,del);
  list.appendChild(card);
 });
}
render();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movie Watchlist</title>
<style>
body{font-family:Arial;background:#18181b;color:white;padding:25px}
main{max-width:650px;margin:auto;background:#27272a;padding:30px;border-radius:16px}
input{width:100%;padding:12px;margin:8px 0;box-sizing:border-box;border:0;border-radius:7px}
button{background:#dc2626;color:white;padding:12px 16px;border:0;border-radius:7px;cursor:pointer;margin:4px}
.movie{background:#3f3f46;padding:20px;margin:12px 0;border-radius:10px}
.watched{color:#86efac}
progress{width:100%;height:22px;accent-color:#22c55e}
</style>
</head>
<body>
<main>
<h1>Movie Watchlist</h1>
<p>Organize the movies you want to watch.</p>
<input id="title" placeholder="Movie title">
<input id="year" type="number" min="1888" max="2100" placeholder="Release year">
<button onclick="addMovie()">Add Movie</button>
<h3 id="summary"></h3>
<progress id="progress" value="0" max="100"></progress>
<div id="movies"></div>
</main>
<script>
let movies=JSON.parse(localStorage.getItem("movies")||"[]");
function save(){
 localStorage.setItem("movies",JSON.stringify(movies));
 render();
}
function addMovie(){
 const title=document.getElementById("title");
 const year=document.getElementById("year");
 const y=Number(year.value);
 if(!title.value.trim()||!Number.isInteger(y)||y<1888||y>2100)return;
 movies.push({title:title.value.trim(),year:y,watched:false});
 title.value=year.value="";
 save();
}
function render(){
 const list=document.getElementById("movies");
 list.innerHTML="";
 movies.forEach((movie,i)=>{
  const item=document.createElement("div");
  item.className="movie";
  const title=document.createElement("h2");
  title.textContent=movie.title+" ("+movie.year+")";
  const status=document.createElement("p");
  status.textContent=movie.watched?"Watched":"Not Watched";
  if(movie.watched)status.className="watched";
  const toggle=document.createElement("button");
  toggle.textContent=movie.watched?"Mark Unwatched":"Mark Watched";
  toggle.onclick=()=>{
   movies[i].watched=!movies[i].watched;
   save();
  };
  const del=document.createElement("button");
  del.textContent="Delete";
  del.onclick=()=>{
   movies.splice(i,1);
   save();
  };
  item.append(title,status,toggle,del);
  list.appendChild(item);
 });
 const watched=movies.filter(movie=>movie.watched).length;
 document.getElementById("summary").textContent=
 watched+" of "+movies.length+" movies watched";
 document.getElementById("progress").value=
 movies.length?watched/movies.length*100:0;
}
render();
</script>
</body>
</html>
